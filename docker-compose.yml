services:
  postgres:
    container_name: postgres_db
    image: postgres:latest
    restart: always
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Persistence_data/backend/init.sql:/docker-entrypoint-initdb.d/1.sql
      - ./Persistence_data/backend/insert_data.sql:/docker-entrypoint-initdb.d/2.sql

  postgres_user_service_db:
    container_name: postgres_user_service_db
    image: postgres:latest
    restart: always
    ports:
      - "${USER_SERVICE_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_SERVICE_POSTGRES_DB}
    volumes:
      - postgres_user_service_data:/var/lib/postgresql/data
      - ./Persistence_data/user_service/init.sql:/docker-entrypoint-initdb.d/1.sql
      - ./Persistence_data/user_service/insert_data.sql:/docker-entrypoint-initdb.d/2.sql

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres
      - postgres_user_service_db

volumes:
  postgres_data:
  postgres_user_service_data:
